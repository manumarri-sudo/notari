name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint and type-check
        run: |
          uv run --locked --extra dev ruff check src tests
          uv run --locked --extra dev ruff format --check src tests
          uv run --locked --extra dev mypy src/notari
      - name: Test
        run: uv run --locked --extra dev pytest tests/
      - name: Audit lockfile with optional and development dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes > "$RUNNER_TEMP/notari-lock-markers.txt"
          # Audit pinned versions for every platform. Installation tests keep the markers.
          sed 's/;.*$//' "$RUNNER_TEMP/notari-lock-markers.txt" | sort -u > "$RUNNER_TEMP/notari-lock.txt"
          uv run --locked --extra dev pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/notari-lock.txt"
      - name: Audit a clean install
        run: |
          uv venv "$RUNNER_TEMP/notari-fresh"
          fresh_python="$RUNNER_TEMP/notari-fresh/bin/python"
          uv pip install --python "$fresh_python" .
          uv pip check --python "$fresh_python"
          uv pip freeze --python "$fresh_python" | sed '/^notari==/d' > "$RUNNER_TEMP/notari-fresh.txt"
          uv run --locked --extra dev pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/notari-fresh.txt"
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
