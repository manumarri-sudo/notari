# Copy to .github/workflows/notari-scan.yml on the default branch.
# Change the branches filter if your pull requests target another branch.
# See QUICKSTART.md for Actions event policy and required status setup.
name: notari-scan

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: _pr_checkout
          persist-credentials: false

      - name: Fetch the PR commit as Git data
        working-directory: _pr_checkout
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_READ_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          auth=$(printf 'x-access-token:%s' "$PR_READ_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD_SHA"

      - name: Scan the fetched commit
        uses: manumarri-sudo/notari@01c0774db86518274a37646d5a0471f228607063  # 0.5.5 release action
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          checkout-path: _pr_checkout
          # Fail the check on NEEDS_REVIEW (a symlink, a submodule swap, a
          # low-confidence credential), not only on BLOCK. Without this a
          # review-class finding posts a green status. Set "false" only if a
          # separate human review gates NEEDS_REVIEW.
          block-on-review: "true"
