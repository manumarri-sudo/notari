# Notari scan, the drop-in workflow. Copy this into .github/workflows/notari-scan.yml.
# The 0.5.0 pin below publishes the legacy status context. Confirm a corrected
# release publishes notari/scan on a test PR before making that context required.
#
# What it does on every pull request, with no keys and no config:
#   BLOCK        a leaked secret (26 vendor formats, matched in full against
#                added, renamed and copied files and against the new lines of
#                modified files), or an edit to .github/workflows/**,
#                .github/actions/**, action.yml / action.yaml, the perimeter
#                files, or .notari/approvers/** (the gate's own surfaces)
#   NEEDS_REVIEW a loose secret shape (DB_PASSWORD = "..."), or a change to CI
#                config, a dependency lockfile, a test file, an agent instruction
#                file (CLAUDE.md, AGENTS.md, .cursorrules), .gitattributes /
#                .gitignore / .gitmodules, a submodule pointer, or a symlink
#   PASS         everything else, with renames, binaries and mode changes listed
#
# The diff is measured from the pull request's merge-base to its head, the same
# diff GitHub shows. The verdict is deterministic (no model), it is posted as the
# notari/scan commit status, and the evidence lands in the job summary.
#
# Make notari/scan a required status check in branch protection and the BLOCK
# cannot be merged. To fail the job on NEEDS_REVIEW too, set block-on-review.
#
# A run with nothing between base and head (an empty pull request, or a push or
# workflow_dispatch run with no base) exits 2 and shows red on purpose: a green
# check on a scan of nothing would be the fail-open this mode must not have.
#
# pull_request_target runs this workflow from the base branch, so a pull request
# cannot edit it away; the PR is checked out into a data-only subdirectory and
# the token is not persisted into that tree. The scan needs no secret, so
# pull_request would also run it, but under pull_request the PR controls this
# file and can delete the scan step, so a required check is only as strong as
# the trigger: keep pull_request_target.
#
# The uses: line must point at a release commit whose action.yml has the mode
# and base-sha inputs (0.5.0 or later). An older pin runs the strict boundary
# verifier instead and fails closed without a contract.
#
name: notari-scan

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (data-only, isolated subdirectory)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: _pr_checkout
          persist-credentials: false

      - name: Notari scan
        uses: manumarri-sudo/notari@04cfc5cf19bbc2652d295665f7f2aee47a3ffe3c  # release action, SHA-pinned; bump on release
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          checkout-path: _pr_checkout
          # block-on-review: "true"   # fail the job on NEEDS_REVIEW as well
